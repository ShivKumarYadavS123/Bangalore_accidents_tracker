<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report Accident — Bangalore Accidents Tracker</title>
  <meta name="description" content="Submit a geotagged accident report for Bangalore. Upload proof and help improve road safety data.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/main.css">
  <!-- MapLibre GL JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.css">
  <script src="https://unpkg.com/maplibre-gl@4.3.2/dist/maplibre-gl.js"></script>
  <style>
    .report-page {
      padding: calc(var(--app-top, 65px) + var(--space-xl)) var(--space-xl) var(--space-xl);
    }
    .report-layout {
      display: grid;
      grid-template-columns: 480px 1fr;
      gap: var(--space-lg);
      align-items: start;
    }
    .report-map-panel { position: sticky; top: calc(var(--app-top, 65px) + var(--space-lg)); }
    .report-map-wrap {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    #report-map {
      width: 100%; height: calc(100vh - 220px);
      min-height: 500px;
      cursor: crosshair;
    }
    .map-pick-hint {
      padding: var(--space-md) var(--space-lg);
      background: rgba(59,130,246,0.06);
      border-top: 1px solid rgba(59,130,246,0.12);
      font-size: var(--font-size-sm);
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }
    .selected-coords {
      padding: var(--space-md) var(--space-lg);
      background: var(--color-minor-bg);
      border-top: 1px solid var(--color-minor-border);
      font-size: var(--font-size-sm);
      color: var(--color-minor);
      display: none;
    }
    .report-header { margin-bottom: var(--space-xl); }
    .report-header h1 { font-size: var(--font-size-2xl); margin-bottom: var(--space-sm); }
    .report-header p { font-size: var(--font-size-sm); }

    /* Proof Upload */
    .upload-area {
      border: 2px dashed var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      text-align: center;
      cursor: pointer;
      transition: all var(--transition-normal);
      position: relative;
    }
    .upload-area:hover, .upload-area.drag-over {
      border-color: var(--color-primary);
      background: var(--color-primary-glow);
    }
    .upload-area input[type="file"] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      opacity: 0; cursor: pointer;
    }
    .upload-icon { font-size: 2.5rem; margin-bottom: var(--space-sm); }
    .upload-title { font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .upload-sub { font-size: var(--font-size-xs); color: var(--text-muted); }
    .upload-preview {
      margin-top: var(--space-md);
      display: none;
    }
    .upload-preview img {
      max-width: 100%;
      max-height: 180px;
      border-radius: var(--radius-md);
      border: 1px solid var(--glass-border);
      object-fit: cover;
    }
    .upload-preview-name {
      margin-top: var(--space-sm);
      font-size: var(--font-size-sm);
      color: var(--color-minor);
      display: flex;
      align-items: center;
      gap: var(--space-sm);
    }

    /* Steps indicator */
    .steps {
      display: flex;
      gap: 0;
      margin-bottom: var(--space-xl);
    }
    .step {
      flex: 1;
      text-align: center;
      position: relative;
    }
    .step::after {
      content: '';
      position: absolute;
      top: 16px;
      right: 0;
      left: 50%;
      height: 2px;
      background: var(--glass-border);
      z-index: 0;
    }
    .step:last-child::after { display: none; }
    .step-circle {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: var(--glass-bg);
      border: 2px solid var(--color-border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-size-sm);
      font-weight: 700;
      margin: 0 auto var(--space-xs);
      position: relative;
      z-index: 1;
      color: var(--text-muted);
      transition: all var(--transition-normal);
    }
    .step.done .step-circle { background: var(--color-minor); border-color: var(--color-minor); color: #fff; }
    .step.active .step-circle { border-color: var(--color-primary); color: var(--color-primary); box-shadow: 0 0 12px var(--color-primary-glow); }
    .step-label { font-size: var(--font-size-xs); color: var(--text-muted); }
    .step.active .step-label { color: var(--color-primary); font-weight: 600; }
    .step.done .step-label { color: var(--color-minor); }

    /* Auth gate */
    .auth-gate {
      text-align: center;
      padding: var(--space-2xl) var(--space-xl);
    }
    .auth-gate-icon { font-size: 3rem; margin-bottom: var(--space-lg); }
    .auth-gate h2 { margin-bottom: var(--space-md); }
    .auth-gate p { margin-bottom: var(--space-xl); }

    @media (max-width: 1024px) {
      .report-layout { grid-template-columns: 1fr; }
      .report-map-panel { position: relative; top: auto; order: -1; }
      #report-map { height: 400px; min-height: unset; }
    }
    @media (max-width: 768px) {
      .report-page { padding: calc(var(--app-top, 65px) + var(--space-md)) var(--space-md) var(--space-md); }
    }
  </style>
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="icon" type="image/png" href="logo-mark.png">
</head>
<body>

<!-- ── Navigation ── -->
<script src="js/sidebar.js"></script>

<div class="report-page" id="page-content">
  <!-- Content injected by JS based on auth state -->
</div>

  <footer style="margin-top: var(--space-xl);">
    <p><strong>Copyright &copy; Students of DSATM CSE</strong></p>
    <p style="margin-bottom:var(--space-md); color: var(--text-muted); font-size: 14px;">Samarth, Shivkumar, Shreyas, Shreejith</p>
    <div class="footer-links" style="margin-bottom:var(--space-md);">
      <a href="index.html">Home</a>
      <a href="dashboard.html">Dashboard</a>
      <a href="report.html">Report</a>
      <a href="login.html">Login</a>
    </div>

  </footer>

<script src="js/bat-config.js"></script>
<script src="js/sos-button.js"></script>
<script src="js/db.js"></script>
<script type="module" src="js/supabase-auth.js"></script>
<script src="js/auth.js"></script>
<script src="js/page-effects.js"></script>
<script src="js/report-submit.js"></script>
<script>
  window.Auth.updateNavAuth();

  // Role Guard: require authenticated Supabase session (Req 3.6)
  (async function() {
    await window.Auth.requireAuth();

    // If we reach here, user is authenticated — get session data from Supabase
    var client = window.SupabaseAuthClient;
    var supaSession = client ? await client.getSession() : null;

    if (!supaSession || !supaSession.user) {
      // Fallback: if session somehow became invalid after check, redirect
      window.location.href = 'login.html?returnTo=report.html';
      return;
    }

    var user = supaSession.user;
    var userName = (user.user_metadata && user.user_metadata.name) || user.email || 'User';

    function escapeHtml(str) {
      const d = document.createElement('div');
      d.textContent = str == null ? '' : String(str);
      return d.innerHTML;
    }

    const page = document.getElementById('page-content');

    // User is authenticated, render the report form
    page.innerHTML = `
      <div class="report-header">
        <h1> Report an Accident</h1>
        <p>Geotagging as <strong style="color:var(--color-primary);">${escapeHtml(userName)}</strong>. Click the map to place accident location.</p>
        <div class="alert alert-error" style="margin-top:var(--space-md);">🚨 <strong>Someone hurt right now?</strong> Use <a href="emergency.html" style="color:inherit;font-weight:800;text-decoration:underline;">Emergency SOS</a> — it alerts the nearest hospitals in one tap, no sign-in needed.</div>
      </div>

      <div class="steps">
        <div class="step done" id="step1">
          <div class="step-circle"></div>
          <div class="step-label">Logged In</div>
        </div>
        <div class="step active" id="step2">
          <div class="step-circle">2</div>
          <div class="step-label">Pin Location</div>
        </div>
        <div class="step" id="step3">
          <div class="step-circle">3</div>
          <div class="step-label">Fill Details</div>
        </div>
        <div class="step" id="step4">
          <div class="step-circle">4</div>
          <div class="step-label">Upload Proof</div>
        </div>
        <div class="step" id="step5">
          <div class="step-circle">5</div>
          <div class="step-label">Submit</div>
        </div>
      </div>

      <div class="report-layout">
        <!-- Form Panel -->
        <div class="report-form-panel">
          <div id="form-alert"></div>

          <form id="report-form">
            <!-- Location -->
            <div class="card" style="margin-bottom:var(--space-lg);">
              <h6 class="card-title"> Location Details</h6>
              <div id="pin-warning" class="alert alert-warning">
                ️ Please click the map on the right to pin the accident location before filling the form.
              </div>
              <div class="form-group">
                <label class="form-label">Latitude</label>
                <input type="text" class="form-control" id="field-lat" readonly placeholder="Click map to set..." required>
              </div>
              <div class="form-group">
                <label class="form-label">Longitude</label>
                <input type="text" class="form-control" id="field-lng" readonly placeholder="Click map to set..." required>
              </div>
              <div class="form-group">
                <label class="form-label">Location Name / Description *</label>
                <input type="text" class="form-control" id="field-location" placeholder="e.g. Silk Board Junction, Hosur Road" required maxlength="100">
              </div>
              <div class="form-group">
                <label class="form-label">Area / Neighbourhood *</label>
                <input type="text" class="form-control" id="field-area" placeholder="e.g. Silk Board, Koramangala" required maxlength="60">
              </div>
            </div>

            <!-- Accident Info -->
            <div class="card" style="margin-bottom:var(--space-lg);">
              <h6 class="card-title"> Accident Information</h6>
              <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-md);">
                <div class="form-group">
                  <label class="form-label">Date *</label>
                  <input type="date" class="form-control" id="field-date" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Time *</label>
                  <input type="time" class="form-control" id="field-time" required>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label">Severity *</label>
                <select class="form-control" id="field-severity" required>
                  <option value="">Select severity...</option>
                  <option value="fatal"> Fatal — Loss of life</option>
                  <option value="serious">🟡 Serious — Major injuries</option>
                  <option value="minor">🟢 Minor — Light injuries / property damage</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">Description *</label>
                <textarea class="form-control" id="field-description" placeholder="Describe what happened, vehicles involved, approximate number of casualties..." required minlength="20" maxlength="500"></textarea>
                <div class="form-hint"><span id="desc-count">0</span>/500 characters</div>
              </div>
            </div>

            <!-- Proof Upload -->
            <div class="card" style="margin-bottom:var(--space-lg);">
              <h6 class="card-title"> Proof of Accident</h6>
              <p style="font-size:var(--font-size-sm);margin-bottom:var(--space-md);">Upload a photo or video as proof. Accepted: JPG, PNG, MP4, MOV (max 10MB).</p>
              <div class="upload-area" id="upload-area">
                <input type="file" id="field-proof" accept="image/*" capture="environment">
                <div class="upload-icon"></div>
                <div class="upload-title">Click or drag &amp; drop proof</div>
                <div class="upload-sub">JPG, PNG up to 10MB — Video files accepted</div>
              </div>
              <div class="upload-preview" id="upload-preview">
                <img id="preview-img" src="" alt="Proof preview">
                <div class="upload-preview-name" id="preview-name"></div>
              </div>
            </div>

            <!-- Live emergency: also alert hospitals -->
            <div class="card" style="margin-bottom:var(--space-lg);border-color:var(--color-fatal-border);background:var(--color-fatal-bg);">
              <label class="check-row" style="display:flex;gap:10px;align-items:flex-start;font-weight:700;cursor:pointer;">
                <input type="checkbox" id="field-live" style="width:20px;height:20px;margin-top:2px;accent-color:#dc2626;">
                <span>🚑 This is happening right now — alert nearby hospitals
                  <span style="display:block;font-weight:400;font-size:var(--font-size-xs);color:var(--text-secondary);margin-top:4px;">We will also send an SOS to the nearest emergency hospitals and show you live ambulance tracking. Still call 108 if anyone is badly hurt.</span>
                </span>
              </label>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn btn-danger btn-lg" id="submit-btn" style="width:100%;" disabled>
               Submit Accident Report
            </button>
            <p style="text-align:center;font-size:var(--font-size-xs);color:var(--text-muted);margin-top:var(--space-sm);">
              Your report will be reviewed before appearing on the public map.
            </p>
          </form>
        </div>

        <!-- Map Panel with Search -->
        <div class="report-map-panel">
          <div style="margin-bottom:var(--space-md);display:flex;gap:var(--space-sm);">
            <input type="text" id="map-search-input" class="form-control" placeholder="Search location to zoom map (e.g. Hebbal, MG Road)..." style="flex:1;">
            <button id="map-search-btn" type="button" class="btn btn-outline" style="cursor:pointer;white-space:nowrap;padding:8px 16px;">Search</button>
          </div>
          <div class="report-map-wrap">
            <div id="report-map"></div>
            <div class="map-pick-hint">
              ️ Click anywhere on the map to drop a pin at the accident location
            </div>
            <div class="selected-coords" id="selected-coords"></div>
          </div>
          <div style="margin-top:var(--space-md);font-size:var(--font-size-xs);color:var(--text-muted);text-align:center;">
            Tip: Zoom in for more precise placement
          </div>
        </div>
      </div>
    `;

    // Set default date/time to now
    const now = new Date();
    document.getElementById('field-date').value = now.toISOString().substr(0, 10);
    document.getElementById('field-time').value = now.toTimeString().substr(0, 5);

    // Desc counter
    document.getElementById('field-description').addEventListener('input', function() {
      document.getElementById('desc-count').textContent = this.value.length;
    });

    // ── MapLibre GL JS Map ──
    const reportMap = new maplibregl.Map({
      container: 'report-map',
      style: 'https://basemaps.cartocdn.com/gl/positron-gl-style/style.json',
      center: [77.5946, 12.9716],
      zoom: 12
    });

    reportMap.addControl(new maplibregl.NavigationControl(), 'top-right');

    // Fix map loading issue in grid layout
    setTimeout(() => {
      reportMap.resize();
    }, 100);

    let pinMarker = null;
    let selectedLat = null, selectedLng = null;

    reportMap.on('click', function(e) {
      selectedLat = e.lngLat.lat.toFixed(6);
      selectedLng = e.lngLat.lng.toFixed(6);
      document.getElementById('field-lat').value = selectedLat;
      document.getElementById('field-lng').value = selectedLng;
      document.getElementById('selected-coords').style.display = 'block';
      document.getElementById('selected-coords').textContent = ` Pinned: ${selectedLat}, ${selectedLng}`;
      document.getElementById('pin-warning').style.display = 'none';
      
      if (pinMarker) {
        pinMarker.setLngLat([selectedLng, selectedLat]);
      } else {
        pinMarker = new maplibregl.Marker({ color: '#ef4444' })
          .setLngLat([selectedLng, selectedLat])
          .addTo(reportMap);
      }
      
      enableSubmitIfReady();
      // Update steps
      document.getElementById('step2').classList.remove('active');
      document.getElementById('step2').classList.add('done');
      document.getElementById('step2').querySelector('.step-circle').textContent = '';
      document.getElementById('step3').classList.add('active');
    });

    // ── Geocoding Search ──
    async function searchLocation() {
      const searchVal = document.getElementById('map-search-input').value.trim();
      if (!searchVal) return;
      const searchBtn = document.getElementById('map-search-btn');
      searchBtn.disabled = true;
      searchBtn.textContent = 'Searching…';

      try {
        const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(searchVal + ', Bengaluru, Karnataka, India')}&format=json&limit=1`;
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        let lat = null, lng = null;
        if (data && data.length > 0) {
          lat = parseFloat(data[0].lat);
          lng = parseFloat(data[0].lon);
        } else {
          // fallback query
          const fallbackUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(searchVal + ', Karnataka, India')}&format=json&limit=1`;
          const resFallback = await fetch(fallbackUrl);
          const dataFallback = await resFallback.json();
          if (dataFallback && dataFallback.length > 0) {
            lat = parseFloat(dataFallback[0].lat);
            lng = parseFloat(dataFallback[0].lon);
          }
        }

        if (lat !== null && lng !== null) {
          reportMap.setCenter([lng, lat]);
          reportMap.setZoom(14);

          selectedLat = lat.toFixed(6);
          selectedLng = lng.toFixed(6);
          document.getElementById('field-lat').value = selectedLat;
          document.getElementById('field-lng').value = selectedLng;
          document.getElementById('selected-coords').style.display = 'block';
          document.getElementById('selected-coords').textContent = ` Pinned: ${selectedLat}, ${selectedLng}`;
          document.getElementById('pin-warning').style.display = 'none';

          if (pinMarker) {
            pinMarker.setLngLat([lng, lat]);
          } else {
            pinMarker = new maplibregl.Marker({ color: '#ef4444' })
              .setLngLat([lng, lat])
              .addTo(reportMap);
          }

          enableSubmitIfReady();

          // Update steps
          document.getElementById('step2').classList.remove('active');
          document.getElementById('step2').classList.add('done');
          document.getElementById('step2').querySelector('.step-circle').textContent = '';
          document.getElementById('step3').classList.add('active');
        } else {
          alert('Location not found. Please try a different name or click directly on the map.');
        }
      } catch (err) {
        alert('Search failed: ' + err.message);
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = 'Search';
      }
    }

    document.getElementById('map-search-btn').addEventListener('click', searchLocation);
    document.getElementById('map-search-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchLocation();
      }
    });

    // ── File Upload ──
    const fileInput = document.getElementById('field-proof');
    const uploadArea = document.getElementById('upload-area');
    const preview = document.getElementById('upload-preview');
    const previewImg = document.getElementById('preview-img');
    const previewName = document.getElementById('preview-name');

    fileInput.addEventListener('change', handleFile);
    uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
    uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('drag-over'));
    uploadArea.addEventListener('drop', e => {
      e.preventDefault(); uploadArea.classList.remove('drag-over');
      if (e.dataTransfer.files[0]) { fileInput.files = e.dataTransfer.files; handleFile(); }
    });

    function handleFile() {
      const file = fileInput.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        showAlert('error', 'Please choose an image file.');
        fileInput.value = '';
        return;
      }
      if (file.size > 10 * 1024 * 1024) {
        showAlert('error', '️ File too large. Maximum 10MB allowed.');
        return;
      }
      previewName.innerHTML = ` <strong>${escapeHtml(file.name)}</strong> (${(file.size/1024/1024).toFixed(2)}MB)`;
      if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = e => { previewImg.src = e.target.result; previewImg.style.display = 'block'; };
        reader.readAsDataURL(file);
      } else {
        previewImg.style.display = 'none';
      }
      preview.style.display = 'block';
      // Update steps
      document.getElementById('step4').classList.add('done');
      document.getElementById('step4').querySelector('.step-circle').textContent = '';
    }

    // ── Form Enable Logic ──
    function enableSubmitIfReady() {
      const hasPin = selectedLat && selectedLng;
      document.getElementById('submit-btn').disabled = !hasPin;
    }

    // Form field changes: update steps
    document.getElementById('field-severity').addEventListener('change', () => {
      document.getElementById('step3').classList.remove('active');
      document.getElementById('step3').classList.add('done');
      document.getElementById('step3').querySelector('.step-circle').textContent = '';
      document.getElementById('step4').classList.add('active');
    });

    // ── Form Submit via API (Req 7.1, 7.3) ──
    // A live crash raises the SOS first, on its own; the report is saved afterwards
    // whatever happened to the SOS (order lives in js/report-submit.js).
    let sentSos = null; // SOS already raised from this form, so a retry never alerts hospitals twice

    // Alert nearby hospitals. Works without a session: anonymous SOS is allowed.
    async function raiseSos(reportData, session) {
      const headers = { 'Content-Type': 'application/json' };
      if (session && session.access_token) headers['Authorization'] = `Bearer ${session.access_token}`;
      const res = await fetch(`${window.BAT_CONFIG.apiBase}/api/emergency`, {
        method: 'POST',
        headers,
        body: JSON.stringify({ lat: reportData.latitude, lng: reportData.longitude, severity: reportData.severity, note: reportData.description, address: [reportData.location, reportData.area].filter(Boolean).join(', '), source: 'report' })
      });
      const sos = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(sos.error || 'SOS failed');
      // Merged into an alert this device raised itself: keep that alert's full-access link.
      let prev = null;
      try { prev = JSON.parse(localStorage.getItem('bat.lastSos') || 'null'); } catch (_) {}
      if (sos.merged && prev && prev.id === sos.alertId) {
        return { ...sos, trackUrl: `track.html?id=${encodeURIComponent(prev.id)}&t=${encodeURIComponent(prev.t)}` };
      }
      try { localStorage.setItem('bat.lastSos', JSON.stringify({ id: sos.alertId, t: sos.trackToken, at: Date.now() })); } catch (_) {}
      return sos.merged ? { ...sos, trackUrl: `${sos.trackUrl}&merged=1` } : sos;
    }

    // Proof upload, then POST /api/reports. Resolves { signedOut: true } or { response } (null when offline).
    async function saveReport(reportData, session) {
      if (!session || !session.access_token) return { signedOut: true };
      const proofFile = fileInput.files[0];
      if (proofFile) {
        if (!window.supabase) throw new Error('Supabase Storage is unavailable.');
        const objectPath = `${session.user.id}/${crypto.randomUUID()}-${proofFile.name.replace(/[^a-zA-Z0-9._-]/g, '_')}`;
        const upload = await window.supabase.storage.from('report-proofs').upload(objectPath, proofFile, { contentType: proofFile.type, upsert: false });
        if (upload.error) throw upload.error;
        reportData.proof_url = window.supabase.storage.from('report-proofs').getPublicUrl(objectPath).data.publicUrl;
      }
      try {
        const response = await fetch(`${window.BAT_CONFIG.apiBase}/api/reports`, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${session.access_token}`
          },
          body: JSON.stringify(reportData)
        });
        return { response };
      } catch (_) {
        return { response: null };
      }
    }

    document.getElementById('report-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> Submitting...';
      const resetButton = () => { btn.disabled = false; btn.innerHTML = ' Submit Accident Report'; };
      const link = 'style="color:inherit;font-weight:700;"';
      let sosNote = '';

      try {
        const reportData = {
          latitude: parseFloat(selectedLat),
          longitude: parseFloat(selectedLng),
          location: document.getElementById('field-location').value,
          area: document.getElementById('field-area').value,
          severity: document.getElementById('field-severity').value,
          date: document.getElementById('field-date').value,
          time: document.getElementById('field-time').value,
          description: document.getElementById('field-description').value,
          proof_url: null
        };

        // Get current Supabase session for JWT (the SOS goes out even without one)
        let session = null;
        try { session = await window.SupabaseAuthClient.getSession(); } catch (_) {}

        const { sos, sosError, report, reportError } = await window.ReportSubmit.submit({
          live: document.getElementById('field-live').checked && !sentSos,
          sendSos: () => raiseSos(reportData, session),
          saveReport: () => saveReport(reportData, session)
        });
        if (sos) sentSos = sos;

        // How the SOS went, added to the report messages below. While it failed,
        // the page never navigates away on its own, so "call 108" stays visible.
        sosNote = sentSos
          ? ` Nearby hospitals have been alerted — <a href="${escapeHtml(sentSos.trackUrl)}" ${link}>open live tracking</a>.`
          : sosError
            ? ` Hospitals could not be alerted (${escapeHtml(sosError.message)}). <a href="emergency.html" ${link}>Send an SOS</a> or call <a href="tel:108" ${link}>108</a>.`
            : '';
        const openTracking = () => { setTimeout(() => { window.location.href = sentSos.trackUrl; }, 1200); };
        const markSent = () => {
          document.getElementById('step5').classList.add('done');
          document.getElementById('step5').querySelector('.step-circle').textContent = '';
        };

        if (reportError) {
          // Network error or proof upload failure
          showAlert('error', ' Unable to submit report. Please check your connection and try again.' + sosNote);
          resetButton();
          return;
        }

        if (report.signedOut) {
          if (sentSos || sosError) {
            showAlert('error', ' Your session has expired, so the report was not saved.' + sosNote);
            resetButton();
            return;
          }
          // User session expired or invalid — redirect to login
          window.location.href = 'login.html?returnTo=report.html';
          return;
        }

        const response = report.response;
        if (response && response.status === 201) {
          // Success — report created
          markSent();
          if (sentSos) {
            showAlert('success', ' Report saved and nearby hospitals alerted. Opening live tracking…');
            openTracking();
          } else if (sosError) {
            showAlert('error', ' Your report was saved.' + sosNote);
          } else {
            showAlert('success', ` Report submitted successfully! It will appear on the map after verification. <a href="profile.html" ${link}>View in your profile →</a>`);
            setTimeout(() => { window.location.href = 'profile.html'; }, 2500);
          }
        } else if (response && (response.status === 400 || response.status === 422)) {
          // Validation errors from server
          const errorData = await response.json().catch(() => ({}));
          const errorMsg = errorData.errors
            ? errorData.errors.join(', ')
            : (errorData.error || 'Invalid report data. Please check your inputs.');
          showAlert('error', ' ' + errorMsg + sosNote);
          resetButton();
        } else if (response && (response.status === 401 || response.status === 403)) {
          const errorData = await response.json().catch(() => ({}));
          const errorMsg = errorData.error || 'Your session is invalid or expired.';
          if (sentSos || sosError) {
            showAlert('error', ' ' + errorMsg + ' The report was not saved.' + sosNote);
            resetButton();
            return;
          }
          showAlert('error', ' ' + errorMsg + ' Please log in again and retry.');
          setTimeout(() => {
            window.location.href = 'login.html?returnTo=report.html';
          }, 1200);
        } else if (!response) {
          // Network outage: keep an API-ready copy for automatic retry when a connection returns.
          window.OfflineReports?.queue?.(reportData);
          const localResult = window.DB && window.DB.addAccident
            ? window.DB.addAccident({ ...reportData, reportedBy: session.user.id, status: 'pending' })
            : null;
          if (!localResult || !localResult.success) {
            showAlert('error', ' Unable to save your report. Please try again.' + sosNote);
            resetButton();
            return;
          }
          markSent();
          if (sentSos) {
            showAlert('success', ' Report saved on this device and nearby hospitals alerted. Opening live tracking…');
            openTracking();
          } else if (sosError) {
            showAlert('error', ' Report saved on this device.' + sosNote);
          } else {
            showAlert('success', ' Report saved successfully! You can view it in your profile.');
            setTimeout(() => { window.location.href = 'profile.html'; }, 1200);
          }
        } else {
          // Server error (500 or other) — do not masquerade as a successful offline save.
          const errorData = await response.json().catch(() => ({}));
          const detail = errorData?.error || 'An unexpected error occurred. Please try again later.';
          showAlert('error', ' ' + detail + sosNote);
          resetButton();
        }
      } catch (err) {
        // Network error or fetch failure
        showAlert('error', ' Unable to submit report. Please check your connection and try again.' + sosNote);
        resetButton();
      }
    });

    function showAlert(type, msg) {
      const el = document.getElementById('form-alert');
      el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
      el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }
  })();
</script>
<script src="js/offline-report-queue.js"></script>
<script src="js/pwa.js"></script>
<script src="js/i18n.js"></script>
</body>
